<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Passage — multi-city journeys</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#100E17; --night:#171422; --slate:#211C2E; --ridge:#312942;
  --amber:#F2A33C; --ember:#D64530; --haze:#BFAED0; --paper:#F6F0E7;
  --dim:#9B90AC; --good:#5FBF8E; --warn:#E8C84B;
  --fx:0.28; --grain:0.055;
  --r:14px;
  --sh:0 18px 48px rgba(0,0,0,.55);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --ink:#EDE5DA; --night:#F6F0E7; --slate:#FFFFFF; --ridge:#DDD0C2;
  --amber:#B4700F; --ember:#B02F1C; --haze:#4B3F5C; --paper:#1B1624;
  --dim:#6B6078; --fx:0.12; --grain:0.02;
  --sh:0 12px 32px rgba(70,50,40,.18);
  color-scheme:light;
}
*{box-sizing:border-box}
html{ -webkit-text-size-adjust:100%; scroll-padding-top:calc(env(safe-area-inset-top,0px) + 8px); }
body{
  margin:0; background:var(--ink); color:var(--paper);
  font-family:Archivo,"Helvetica Neue",Arial,sans-serif; font-size:15px; line-height:1.5;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  overflow-x:hidden;
}
body::after{ /* film grain */
  content:""; position:fixed; inset:0; pointer-events:none; z-index:900; opacity:var(--grain);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
  mix-blend-mode:overlay;
}
h1,h2,h3,.disp{font-family:Fraunces,Georgia,serif; font-weight:500; letter-spacing:-.01em; margin:0}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer; background:none; border:0}
a{color:var(--amber)}
:focus-visible{outline:2px solid var(--amber); outline-offset:3px; border-radius:6px}
.wrap{max-width:1180px; margin:0 auto; padding:0 18px}
.hide{display:none !important}

/* ---------- ad rail (above profile bar) ---------- */
.adrail{
  position:relative; background:linear-gradient(97deg,var(--ember),#7A2A5E 55%,#2B3E7A);
  color:#FFF6E8; overflow:hidden; border-bottom:1px solid rgba(0,0,0,.35);
}
.adrail .wrap{display:flex; align-items:center; gap:14px; min-height:46px; padding-top:6px; padding-bottom:6px}
.adtag{font-size:10px; font-weight:700; letter-spacing:.14em; border:1px solid rgba(255,255,255,.55); padding:2px 7px; border-radius:99px; flex:0 0 auto; opacity:.9}
.adtxt{flex:1; min-width:0; font-size:13.5px; font-weight:500}
.adtxt b{font-weight:700}
.adcta{flex:0 0 auto; background:#FFF6E8; color:#40142B; font-weight:700; font-size:12.5px; padding:6px 13px; border-radius:99px}
.addots{display:flex; gap:5px; flex:0 0 auto}
.addots i{width:6px;height:6px;border-radius:99px;background:rgba(255,255,255,.4)}
.addots i.on{background:#FFF6E8; width:16px}

/* ---------- profile bar ---------- */
.profbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:600;
  background:color-mix(in srgb, var(--night) 88%, transparent); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--ridge);
}
.profbar .wrap{display:flex; align-items:center; gap:14px; min-height:62px}
.brand{display:flex; align-items:center; gap:10px}
.brandmark{width:32px; height:32px; flex:0 0 auto; display:block}
.logo{font-family:Fraunces; font-size:23px; font-weight:700; letter-spacing:-.02em; line-height:1}
.logo span{color:var(--amber)}
.logosub{font-size:10px; color:var(--dim); letter-spacing:.18em; margin-top:2px}
.navspace{flex:1}
.pill{border:1px solid var(--ridge); background:var(--slate); border-radius:99px; padding:6px 13px; font-size:13px; font-weight:500; display:inline-flex; align-items:center; gap:7px}
.pill:hover{border-color:var(--amber)}
.avatar{width:36px;height:36px;border-radius:99px;background:linear-gradient(140deg,var(--amber),var(--ember)); color:#2A0E08; display:grid; place-items:center; font-weight:700; font-size:14px; font-family:Fraunces}
.who{line-height:1.15}
.who b{display:block; font-size:13.5px}
.who i{font-style:normal; font-size:11px; color:var(--amber); letter-spacing:.06em}

/* ---------- step rail ---------- */
.steps{border-bottom:1px solid var(--ridge); background:var(--night); position:sticky; top:calc(env(safe-area-inset-top,0px) + 62px); z-index:500}
.steps .wrap{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none}
.steps .wrap::-webkit-scrollbar{display:none}
.step{padding:12px 15px; font-size:12.5px; color:var(--dim); white-space:nowrap; border-bottom:2px solid transparent; font-weight:500; display:flex; gap:8px; align-items:center}
.step b{font-family:Fraunces; font-size:12px; opacity:.6}
.step.on{color:var(--paper); border-bottom-color:var(--amber)}
.step.done{color:var(--haze)}
.step.lock{opacity:.4}

/* ---------- hero ---------- */
.hero{position:relative; height:clamp(320px,52vh,480px); overflow:hidden; background:#000}
.hero .frame{position:absolute; inset:0; background-size:cover; background-position:center; opacity:0; transition:opacity 1.4s ease}
.hero .frame.on{opacity:1; animation:kb 14s ease-out forwards}
@keyframes kb{from{transform:scale(1.04)}to{transform:scale(1.13)}}
.hero::after{content:""; position:absolute; inset:0; background:linear-gradient(to top,var(--ink) 4%,rgba(16,14,23,.35) 45%,rgba(16,14,23,.6))}
.bars{position:absolute; left:0; right:0; height:34px; background:#000; z-index:3}
.bars.t{top:0} .bars.b{bottom:0}
.herotxt{position:absolute; left:0; right:0; bottom:54px; z-index:4}
.herotxt h1{font-size:clamp(40px,8vw,82px); font-weight:300; line-height:.95; letter-spacing:-.03em}
.herotxt h1 em{font-style:italic; font-weight:500; color:var(--amber)}
.herotxt p{max-width:46ch; color:var(--haze); margin:12px 0 0; font-size:15px}
.reveal{opacity:0; transform:translateY(14px); animation:rv .9s cubic-bezier(.2,.7,.3,1) forwards}
.reveal.d1{animation-delay:.15s}.reveal.d2{animation-delay:.32s}.reveal.d3{animation-delay:.5s}
@keyframes rv{to{opacity:1; transform:none}}

/* ---------- two column with rail ---------- */
.sidegrid{display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:18px; align-items:start}
.rail{display:grid; gap:14px; position:sticky; top:calc(env(safe-area-inset-top,0px) + 116px); min-width:0}
@media(max-width:940px){
  .sidegrid{grid-template-columns:1fr}
  .rail{position:static; top:auto}
  .filters{position:static}
}

/* ---------- panels ---------- */
.panel{background:var(--night); border:1px solid var(--ridge); border-radius:var(--r); padding:18px}
.panel.flat{background:transparent}
.sect{padding:34px 0}
.sect h2{font-size:clamp(24px,3.4vw,34px); font-weight:300}
.sect h2 em{font-style:italic; color:var(--amber); font-weight:500}
.lede{color:var(--dim); max-width:62ch; margin:8px 0 0; font-size:14px}
.grid{display:grid; gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
label.fl{display:block; font-size:11.5px; color:var(--dim); margin-bottom:5px; letter-spacing:.03em}
.inp{width:100%; background:var(--slate); border:1px solid var(--ridge); border-radius:10px; padding:11px 12px; font-size:14px}
.inp:focus{border-color:var(--amber); outline:none}
select.inp{appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%); background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%; background-size:5px 5px,5px 5px; background-repeat:no-repeat}
.btn{background:var(--amber); color:#2A1708; font-weight:700; border-radius:10px; padding:12px 20px; font-size:14px}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4; cursor:not-allowed; filter:none}
.btn.ghost{background:transparent; border:1px solid var(--ridge); color:var(--paper); font-weight:600}
.btn.ghost:hover{border-color:var(--amber)}
.btn.danger{background:var(--ember); color:#FFF1EA}
.btn.sm{padding:8px 14px; font-size:12.5px; border-radius:8px}
.err{color:var(--ember); font-size:12px; margin-top:6px; min-height:1em}
.note{font-size:12.5px; color:var(--dim)}
.tag{display:inline-block; font-size:10.5px; font-weight:600; letter-spacing:.06em; padding:3px 8px; border-radius:99px; border:1px solid var(--ridge); color:var(--haze)}
.tag.am{border-color:var(--amber); color:var(--amber)}
.tag.gd{border-color:var(--good); color:var(--good)}
.tag.em{border-color:var(--ember); color:var(--ember)}
.divider{height:1px; background:var(--ridge); margin:18px 0}

/* ---------- mode cards ---------- */
.modes{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px}
.mode{position:relative; height:186px; border-radius:var(--r); overflow:hidden; border:1px solid var(--ridge); text-align:left; display:block; width:100%}
.mode img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:transform .6s ease}
.mode:hover img{transform:scale(1.06)}
.mode .vg{position:absolute; inset:0; background:linear-gradient(to top,rgba(10,8,14,.95) 12%,rgba(10,8,14,.15) 70%)}
.mode .in{position:absolute; left:14px; right:14px; bottom:12px; color:#F6F0E7}
.mode .in h3{font-size:20px; font-weight:500}
.mode .in .cnt{font-size:12px; color:#CDBFDC}
.mode .in .pr{font-size:13px; font-weight:700; color:var(--amber); margin-top:4px}
.mode.sel{border-color:var(--amber); box-shadow:0 0 0 2px rgba(242,163,60,.35)}
.mode .chk{position:absolute; top:10px; right:10px; width:24px;height:24px;border-radius:99px; background:rgba(0,0,0,.5); border:1px solid rgba(255,255,255,.4); display:grid; place-items:center; font-size:13px; color:#fff}
.mode.sel .chk{background:var(--amber); color:#2A1708; border-color:var(--amber)}

/* ---------- legs ---------- */
.leg{background:var(--night); border:1px solid var(--ridge); border-radius:var(--r); padding:14px; display:grid; gap:12px; grid-template-columns:1fr 1fr 150px 130px 40px; align-items:end}
@media(max-width:820px){.leg{grid-template-columns:1fr 1fr}.leg .rm{grid-column:span 2}}
.legno{font-family:Fraunces; font-size:12px; color:var(--dim)}

/* ---------- results ---------- */
.filters{position:sticky; top:calc(env(safe-area-inset-top,0px) + 106px); z-index:400; background:var(--night); border:1px solid var(--ridge); border-radius:var(--r); padding:14px; margin-bottom:16px}
.chips{display:flex; gap:7px; flex-wrap:wrap}
.chip{border:1px solid var(--ridge); background:var(--slate); padding:6px 12px; border-radius:99px; font-size:12.5px; color:var(--haze); font-weight:500}
.chip.on{background:var(--amber); color:#2A1708; border-color:var(--amber); font-weight:700}
input[type=range]{width:100%; accent-color:var(--amber)}
.opt{border:1px solid var(--ridge); background:var(--night); border-radius:var(--r); overflow:hidden; margin-bottom:12px}
.opt .head{display:grid; grid-template-columns:78px 1fr auto; gap:14px; padding:14px; align-items:center}
@media(max-width:700px){
  .opt .head{grid-template-columns:56px 1fr}
  .opt .head .price{grid-column:span 2; text-align:left; display:flex; align-items:center; gap:10px; justify-content:space-between; flex-wrap:wrap}
  .opt .head .price .row{margin-top:0 !important; justify-content:flex-end !important; flex:0 0 auto}
  .price .per{flex:1 1 90px; min-width:80px}
  .opt .obody .grid.g2{grid-template-columns:1fr}
}
.thumb{width:78px;height:62px;border-radius:10px; overflow:hidden; position:relative}
.thumb img{width:100%;height:100%;object-fit:cover}
@media(max-width:700px){.thumb{width:56px;height:50px}}
.opname{font-weight:600; font-size:15px}
.ometa{font-size:12.5px; color:var(--dim); margin-top:3px}
.otime{display:flex; gap:12px; align-items:center; margin-top:7px; font-size:13px}
.otime .t{font-family:Fraunces; font-size:17px}
.track{flex:1; height:1px; background:var(--ridge); position:relative; min-width:44px}
.track::before,.track::after{content:""; position:absolute; top:-2.5px; width:6px;height:6px;border-radius:99px;background:var(--haze)}
.track::before{left:0}.track::after{right:0}
.price{text-align:right}
.price .amt{font-family:Fraunces; font-size:27px; font-weight:500}
.price .per{font-size:11px; color:var(--dim)}
.stars{color:var(--amber); font-size:12px; letter-spacing:1px}
.obody{border-top:1px solid var(--ridge); padding:14px; background:var(--slate)}
.bd{display:flex; justify-content:space-between; font-size:13px; padding:5px 0; border-bottom:1px dashed var(--ridge)}
.bd:last-child{border:0}
.bd.tot{font-weight:700; font-size:15px; border-top:1px solid var(--ridge); margin-top:4px; padding-top:9px}
.bd span:last-child{font-variant-numeric:tabular-nums}

/* ---------- seat map ---------- */
.seatwrap{display:grid; grid-template-columns:minmax(0,1fr) minmax(320px,460px); gap:16px}
@media(max-width:900px){.seatwrap{grid-template-columns:1fr}}
.deck{background:var(--slate); border:1px solid var(--ridge); border-radius:var(--r); padding:16px 12px; overflow-x:auto; max-width:540px; margin:0 auto; width:100%}
.rowline{display:flex; gap:7px; align-items:center; justify-content:center; margin-bottom:7px}
.rowno{width:22px; font-size:11px; color:var(--dim); text-align:center; flex:0 0 auto}
.aisle{width:18px; flex:0 0 auto}
.seat{width:34px;height:34px;border-radius:7px; border:1px solid var(--ridge); background:var(--night); font-size:10.5px; color:var(--haze); display:grid; place-items:center; flex:0 0 auto; font-weight:600}
.seat:hover:not(.x){border-color:var(--amber)}
.seat.x{background:#2A2230; color:#584C66; cursor:not-allowed; border-style:dashed}
.seat.p{border-color:var(--amber); color:var(--amber)}
.seat.on{background:var(--amber); color:#2A1708; border-color:var(--amber)}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--dim); margin-top:12px}
.legend i{width:12px;height:12px;border-radius:4px; display:inline-block; vertical-align:-2px; margin-right:5px; border:1px solid var(--ridge)}

/* ---------- live camera ---------- */
.cam{position:relative; border-radius:var(--r); overflow:hidden; border:1px solid var(--ridge); background:#000}
.cam canvas{display:block; width:100%; height:auto}
.camhud{position:absolute; inset:0; pointer-events:none; font-size:10.5px; letter-spacing:.08em; color:#E9DFF2; text-shadow:0 1px 3px #000}
.camhud .tl{position:absolute; top:9px; left:10px; display:flex; align-items:center; gap:6px}
.camhud .tr{position:absolute; top:9px; right:10px}
.camhud .bl{position:absolute; bottom:9px; left:10px}
.camhud .br{position:absolute; bottom:9px; right:10px}
.rec{width:8px;height:8px;border-radius:99px;background:#FF3B30; animation:blink 1.2s steps(1,end) infinite}
@keyframes blink{50%{opacity:.15}}
.scan{position:absolute; inset:0; background:repeating-linear-gradient(to bottom,rgba(255,255,255,.045) 0 1px,transparent 1px 3px); pointer-events:none}

/* ---------- speed gauge ---------- */
.gauge{display:flex; align-items:baseline; gap:8px}
.gauge .v{font-family:Fraunces; font-size:46px; font-weight:500; line-height:1; font-variant-numeric:tabular-nums}
.gauge .u{color:var(--dim); font-size:13px}
.bar{height:7px; background:var(--slate); border-radius:99px; overflow:hidden; border:1px solid var(--ridge)}
.bar i{display:block; height:100%; background:linear-gradient(90deg,var(--good),var(--amber),var(--ember)); transition:width .7s ease}
.spark{display:flex; gap:2px; align-items:flex-end; height:44px}
.spark{gap:3px}
.spark i{flex:1; min-width:3px; background:linear-gradient(to top,rgba(242,163,60,.25),var(--amber)); border-radius:2px 2px 0 0; transition:height .6s ease}

/* ---------- modal ---------- */
.scrim{position:fixed; inset:0; background:rgba(6,4,10,.82); backdrop-filter:blur(6px); z-index:1000; display:grid; place-items:center; padding:20px}
.modal{background:var(--night); border:1px solid var(--ridge); border-radius:18px; max-width:520px; width:100%; box-shadow:var(--sh); max-height:88vh; overflow:auto}
.modal .mh{padding:20px 22px 0}
.modal .mb{padding:14px 22px}
.modal .mf{padding:16px 22px 20px; display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap}
.modal h3{font-size:25px; font-weight:300}
.modal h3 em{font-style:italic; color:var(--amber)}

/* ---------- meta ai ---------- */
.fab{position:fixed; right:18px; bottom:calc(18px + env(safe-area-inset-bottom,0px)); z-index:800; background:linear-gradient(135deg,#2B7CF5,#8A4BE0); color:#fff; border-radius:99px; padding:12px 18px; font-weight:700; font-size:13.5px; box-shadow:0 12px 30px rgba(43,124,245,.4); display:flex; align-items:center; gap:9px}
.ai{position:fixed; right:0; bottom:0; top:0; width:min(420px,100%); background:var(--night); border-left:1px solid var(--ridge); z-index:999; display:flex; flex-direction:column; box-shadow:var(--sh); transform:translateX(100%); transition:transform .38s cubic-bezier(.3,.8,.3,1); padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
.ai.open{transform:none}
.aih{padding:16px 18px; border-bottom:1px solid var(--ridge); display:flex; align-items:center; gap:11px}
.aidot{width:30px;height:30px;border-radius:99px;background:linear-gradient(135deg,#2B7CF5,#8A4BE0); display:grid; place-items:center; font-size:14px}
.aib{flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:11px}
.msg{max-width:88%; padding:11px 14px; border-radius:15px; font-size:13.5px; line-height:1.55}
.msg.a{background:var(--slate); border:1px solid var(--ridge); border-bottom-left-radius:5px; align-self:flex-start}
.msg.u{background:linear-gradient(135deg,#2B7CF5,#8A4BE0); color:#fff; border-bottom-right-radius:5px; align-self:flex-end}
.msg b{color:var(--amber)} .msg.u b{color:#FFE7A8}
.aif{padding:12px 14px; border-top:1px solid var(--ridge)}

/* ---------- maps ---------- */
.mapbox{background:var(--slate); border:1px solid var(--ridge); border-radius:var(--r); padding:8px}
.mapbox svg{display:block; width:100%; height:auto}

/* ---------- tourist ---------- */
.spot{border:1px solid var(--ridge); border-radius:var(--r); overflow:hidden; background:var(--night)}
.spot .art{height:158px; position:relative}
.spot .art svg{width:100%;height:100%; display:block}
.spot .in{padding:14px}
.spot h4{margin:0 0 4px; font-size:16.5px; font-family:Fraunces; font-weight:500}
.kv{display:flex; justify-content:space-between; font-size:12px; color:var(--dim); margin-top:8px; gap:10px}

/* ---------- ticket ---------- */
.ticket{border:1px solid var(--ridge); border-radius:var(--r); overflow:hidden; background:var(--night); margin-bottom:14px}
.tkh{padding:15px; display:flex; justify-content:space-between; gap:12px; align-items:flex-start; background:linear-gradient(120deg,rgba(242,163,60,.14),transparent)}
.tkb{padding:15px; border-top:1px dashed var(--ridge)}
.pnr{font-family:Fraunces; font-size:19px; letter-spacing:.06em}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(84px + env(safe-area-inset-bottom,0px)); background:var(--slate); border:1px solid var(--amber); color:var(--paper); padding:12px 20px; border-radius:99px; z-index:1100; font-size:13.5px; font-weight:500; box-shadow:var(--sh)}
@media(max-width:720px){
  .adrail .wrap{min-height:40px; gap:10px}
  .adtag,.addots{display:none}
  .adtxt{font-size:12.5px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .adcta{font-size:11.5px; padding:5px 11px}
  .profbar .wrap{min-height:56px; gap:8px}
  .logo{font-size:19px} .logosub{display:none}
  .profbar .pill{padding:6px 10px; font-size:12px}
  #navExplore,#navTickets{font-size:0; gap:0}
  #navExplore::before{content:"◎"; font-size:15px}
  #navTickets::before{content:"▤"; font-size:15px}
  #tkCount{font-size:10.5px}
  .who b{font-size:12px} .who i{font-size:10px}
  .steps{top:calc(env(safe-area-inset-top,0px) + 56px)}
  .step{padding:10px 11px; font-size:12px}
  .hero{height:clamp(250px,42vh,340px)}
  .sect{padding:26px 0}
  .fab{padding:10px 15px; font-size:12.5px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important}}

/* ---------- added travel services hub ---------- */
.service-hero{padding:34px 0 18px;background:radial-gradient(ellipse at 80% 0%,rgba(242,163,60,.14),transparent 55%)}
.service-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:14px;margin-top:18px}
.service-card{background:var(--night);border:1px solid var(--ridge);border-radius:var(--r);padding:18px;min-width:0}
.service-card h3{font-size:20px;margin:0 0 6px}
.service-icon{font-size:25px;margin-bottom:9px}
.service-card p{font-size:13px;color:var(--dim);margin:0 0 13px}
.service-card .btn{margin-top:5px}
.service-wide{grid-column:1/-1}
.food-item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--ridge)}
.food-item:last-child{border-bottom:0}
.food-emoji{width:48px;height:48px;border-radius:12px;background:var(--slate);display:grid;place-items:center;font-size:25px;flex:0 0 auto}
.food-info{flex:1;min-width:0}.food-info b{display:block}.food-info small{color:var(--dim)}
.service-status{font-size:12px;color:var(--good);margin-top:8px;min-height:1em}
.service-links{display:flex;gap:8px;flex-wrap:wrap}
.service-links a{display:inline-flex;align-items:center;border:1px solid var(--ridge);border-radius:9px;padding:9px 12px;text-decoration:none;color:var(--paper);font-size:13px}
.service-links a:hover{border-color:var(--amber)}
@media(max-width:720px){#navServices{font-size:0;padding:6px 10px}#navServices::before{content:'✦';font-size:15px}.service-wide{grid-column:auto}}

</style>
</head>
<body>
<!-- ================= AD RAIL ================= -->
<div class="adrail" id="adrail">
  <div class="wrap">
    <span class="adtag" id="adtag">OFFER</span>
    <div class="adtxt" id="adtxt"></div>
    <button class="adcta" id="adcta">See deal</button>
    <div class="addots" id="addots"></div>
  </div>
</div>

<!-- ================= PROFILE BAR ================= -->
<header class="profbar">
  <div class="wrap">
    <div class="brand">
      <svg class="brandmark" viewBox="0 0 40 40" aria-hidden="true">
        <defs><linearGradient id="lgGrad" x1="6" y1="4" x2="34" y2="36" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="var(--amber)"/><stop offset="1" stop-color="var(--ember)"/>
        </linearGradient></defs>
        <line x1="12.5" y1="6" x2="12.5" y2="34" stroke="url(#lgGrad)" stroke-width="5" stroke-linecap="round"/>
        <path d="M12.5 6 Q29 6 29 15 Q29 22 12.5 20" fill="none" stroke="url(#lgGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M35.6 15 Q37.4 16.3 39 15.2" fill="none" stroke="var(--amber)" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="0.2 3.6" opacity="0.5"/>
        <circle cx="29" cy="15" r="6.4" fill="none" stroke="var(--amber)" stroke-width="1.1" opacity="0.38"/>
        <circle cx="29" cy="15" r="3.2" fill="var(--amber)"/>
      </svg>
      <div>
        <div class="logo">Pass<span>age</span></div>
        <div class="logosub">MULTI-CITY TRAVEL</div>
      </div>
    </div>
    <div class="navspace"></div>
    <button class="pill" id="navExplore">Places to see</button>
    <button class="pill" id="navTickets">My tickets <span id="tkCount" class="tag am">0</span></button>
    <button class="pill" id="navServices">Travel services</button>
    <button class="pill" id="themeBtn" title="Switch appearance">◐</button>
    <button class="pill" id="profBtn" style="padding:4px 12px 4px 4px">
      <span class="avatar" id="avatar">?</span>
      <span class="who"><b id="whoName">Create profile</b><i id="whoTier">Booking locked</i></span>
    </button>
  </div>
</header>

<!-- ================= STEP RAIL ================= -->
<nav class="steps" id="stepRail"></nav>

<main id="main"></main>

<!-- ================= META AI ================= -->
<button class="fab" id="aiFab">✦ Meta AI</button>
<aside class="ai" id="aiPanel" aria-label="Meta AI assistant">
  <div class="aih">
    <div class="aidot">✦</div>
    <div style="flex:1">
      <b style="font-size:14.5px">Meta AI</b>
      <div style="font-size:11px;color:var(--good)">● Live · trip-aware support</div>
    </div>
    <button class="pill" id="aiClose">Close</button>
  </div>
  <div class="aib" id="aiBody"></div>
  <div class="aif">
    <div class="chips" id="aiChips" style="margin-bottom:9px"></div>
    <div class="row" style="flex-wrap:nowrap">
      <input class="inp" id="aiInput" placeholder="Ask about fares, visas, seats…">
      <button class="btn sm" id="aiSend" style="flex:0 0 auto">Send</button>
    </div>
  </div>
</aside>

<div id="modalHost"></div>
<div id="toastHost"></div>

/* ============================================================
   SEEDED GENERATOR
   ============================================================ */
function hash(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function rng(seed){ let a=hash(seed); return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const pick = (r,arr) => arr[Math.floor(r()*arr.length)];
const between = (r,a,b) => a + r()*(b-a);
const inti = (r,a,b) => Math.floor(between(r,a,b+1));

const STAR_MULT = {1:0.62,2:0.78,3:1,4:1.34,5:1.92};
const CLS_MULT  = [1, 1.28, 1.74, 2.55];

function modeAvailable(mode, km, leg){
  const M = MODES[mode];
  // no land or rail link across water — flights only, plus metro once you land
  if(leg && (CITIES[leg.from].sea || CITIES[leg.to].sea) && CITIES[leg.from].c !== CITIES[leg.to].c){
    if(mode !== 'flight' && mode !== 'metro') return false;
  }
  if(mode === 'metro') return true;                     // whole leg when short, last-mile otherwise
  return km >= M.minKm && km <= M.maxKm;
}

function legKm(leg, mode){
  const km = distKm(leg.from, leg.to);
  if(mode === 'metro' && km > 65) return null;          // handled as last-mile
  return km;
}

/* ---------- dynamic pricing: why two vehicles on one route never cost the same ---------- */
function daysUntil(date){ return Math.round((new Date(date+'T00:00:00') - new Date(todayISO+'T00:00:00')) / 86400000); }
function priceFactors(mode, opName, date, dep, seatsLeft, r){
  const f = [];
  // rail, road and cabs are priced on thinner margins than air, so their demand swings are scaled up to be visible
  const gain = {flight:1, train:1.9, bus:1.7, car:2.1, metro:1}[mode];
  const add = (label, pct, raw) => { const v = raw ? pct : pct*gain; if(Math.abs(v) >= 3) f.push({label, pct:Math.round(v)}); };
  // operator tier: each operator keeps its own price personality on every route
  const tier = 0.84 + (hash(mode+opName) % 1000)/1000 * 0.42;           // 0.84 – 1.26
  add(tier >= 1.08 ? 'Premium operator' : tier <= 0.94 ? 'Budget operator' : 'Operator pricing', (tier-1)*100, true);
  // time of day
  const h = dep/60, peak = (h>=6 && h<=9.5) || (h>=17 && h<=21), night = h>=22 || h<5;
  if(mode==='flight') add(peak?'Peak-hour departure':night?'Red-eye discount':'Off-peak departure', peak?14:night?-12:-3);
  if(mode==='train')  add(peak?'Peak-hour departure':night?'Night service':'Off-peak departure', peak?6:night?-4:-2);
  if(mode==='bus')    add(peak?'Peak-hour departure':night?'Night service':'Off-peak departure', peak?8:night?-6:-2);
  if(mode==='car')    add(peak?'Surge pricing':night?'Night charge':'Standard rate', peak?18:night?10:0);
  // seats left: scarce inventory costs more, empty vehicles discount
  if(mode!=='car' && mode!=='metro'){
    if(seatsLeft<=4) add(`Last ${seatsLeft} seats`, 22);
    else if(seatsLeft<=9) add('Filling fast', 12);
    else if(seatsLeft>=35) add('Plenty of seats', -7);
  } else if(mode==='car' && r() < 0.2) add('High demand', 15);
  // how far ahead you book
  const d = daysUntil(date);
  if(mode==='flight'){ add(d<=1?'Last-minute fare':d<=3?'Short notice':d<=7?'Booked within a week':d>30?'Early-bird fare':d>14?'Advance purchase':'', d<=1?35:d<=3?22:d<=7?10:d>30?-14:d>14?-8:0); }
  if(mode==='train'){ add(d<=1?'Tatkal premium':d<=3?'Short notice':d>30?'Early-bird fare':'', d<=1?15:d<=3?8:d>30?-4:0); }
  if(mode==='bus'){ add(d<=1?'Last-minute fare':d<=3?'Short notice':d>14?'Advance purchase':'', d<=1?12:d<=3?6:d>14?-5:0); }
  // weekend
  const dow = new Date(date+'T00:00:00').getDay(), wknd = dow===5||dow===6||dow===0;
  if(wknd && mode!=='metro') add('Weekend demand', {flight:8, train:4, bus:6, car:9}[mode]);
  const raw = f.reduce((a,x)=>a*(1+x.pct/100), 1);
  // surcharges taper off as they stack (a fully loaded fare tops out near +50%), discounts bottom out near −30%
  const mult = raw > 1 ? 1 + (raw-1)/(1+(raw-1)*0.95) : Math.max(0.7, raw);
  return {mult, list:f.filter(x=>x.label)};
}

function genOptions(leg, mode, date){
  const M = MODES[mode];
  const fullKm = distKm(leg.from, leg.to);
  if(!modeAvailable(mode, fullKm, leg)) return [];
  const lastMile = (mode === 'metro' && fullKm > 65);
  const r = rng(`${leg.from}${leg.to}${mode}${date}`);
  const counts = {flight:[6,11], train:[8,14], bus:[12,20], car:[6,10], metro:[4,7]}[mode];
  const n = inti(r, counts[0], counts[1]);
  const out = [];
  for(let i=0;i<n;i++){
    const [opName, baseStars] = pick(r, M.ops);
    const stars = Math.max(1, Math.min(5, baseStars + (r()<0.22 ? (r()<0.5?-1:1) : 0)));
    const clsIdx = Math.min(3, Math.max(0, Math.round(between(r, stars-2.2, stars-0.4))));
    const km = lastMile ? Math.round(between(r, 7, 26)) : Math.round(fullKm * between(r, 0.97, 1.13));
    const speedFactor = between(r, 0.84, 1.14) * (0.94 + stars*0.03);
    const mins = Math.round(M.overhead + (km / (M.speed*speedFactor)) * 60);
    const dep = inti(r, 0, 1) ? inti(r, 5*60, 12*60) : inti(r, 13*60, 23*60);
    const seatsLeft = mode==='car' ? inti(r,1,4) : inti(r,2,48);
    const seasonal = between(r, 0.93, 1.12);
    const dyn = priceFactors(mode, opName, date, dep, seatsLeft, r);
    let fare = (M.base + M.perKm * km) * STAR_MULT[stars] * CLS_MULT[clsIdx] * seasonal * dyn.mult;
    if(mode==='metro') fare = Math.min(fare, 220 + stars*40);
    fare = Math.round(fare/5)*5;
    const gstRate = mode==='flight' ? 0.05 : mode==='car' ? 0.05 : mode==='metro' ? 0 : 0.05;
    const conv = mode==='metro' ? 0 : Math.round(Math.min(280, 25 + fare*0.018));
    const sur = mode==='flight' ? Math.round(180 + km*0.22)
              : mode==='car'    ? Math.round(km*0.9 + 60)
              : mode==='bus'    ? Math.round(18 + km*0.06)
              : mode==='train'  ? Math.round(15 + km*0.03) : 0;
    const surLabel = {flight:'Airport & fuel charge', car:'Fuel + toll estimate', bus:'Terminal fee', train:'Reservation charge', metro:''}[mode];
    const tax = Math.round((fare + sur) * gstRate);
    const total = fare + sur + tax + conv;
    out.push({
      id: `${mode}-${leg.from}${leg.to}-${date}-${i}`,
      mode, opName, stars, km, mins, dep, lastMile,
      code: (mode==='flight'?'':'')+ (opName.slice(0,2).toUpperCase()) + inti(r,100,999),
      cls: M.cls[clsIdx],
      perVehicle: mode === 'car',
      seatsLeft, factors: dyn.list, dynPct: Math.round((dyn.mult-1)*100),
      onTime: inti(r, 71, 98),
      avgSpeed: Math.round(km / (mins/60)),
      topSpeed: Math.round(M.speed * speedFactor * between(r,1.05,1.24)),
      amen: amenities(r, mode, stars),
      fare, sur, surLabel, tax, conv, total,
      rows: seatPlan(mode, stars, r)
    });
  }
  return out;
}

function amenities(r, mode, stars){
  const pool = {
    flight:['Cabin baggage 7 kg','Check-in 15 kg','Meal included','Extra legroom','Lounge access','Priority boarding','Wi-Fi on board'],
    train:['Bedroll provided','Pantry car','Charging point','Catering included','Bio-toilet','Reading light','Wi-Fi'],
    bus:['Charging point','Blanket','Live tracking','Water bottle','Reading light','Rest stop every 3 h','Onboard toilet'],
    car:['Air conditioned','Driver allowance included','Toll included','Luggage 3 bags','Child seat on request','Doorstep pickup','Music system'],
    metro:['Air conditioned','Step-free access','Women-only coach','Real-time arrivals','Card top-up at gate','Cycle parking']
  }[mode];
  const k = Math.min(pool.length, 2 + stars);
  const s = new Set(); let guard=0;
  while(s.size < k && guard++ < 40) s.add(pick(r, pool));
  return [...s];
}

/* ---------- seat layouts ---------- */
function seatPlan(mode, stars, r){
  const cfg = {
    flight:{cols:['A','B','C','','D','E','F'], rows:inti(r,18,30)},
    train:{cols:['1','2','','3','4'], rows:inti(r,12,18)},
    bus:{cols:['A','B','','C','D'], rows:inti(r,9,13)},
    car:{cols:['F','','R1','R2'], rows:1},
    metro:{cols:['A','B','','C','D'], rows:inti(r,6,9)}
  }[mode];
  const taken = new Set(), prem = new Set();
  const total = cfg.rows * cfg.cols.filter(Boolean).length;
  const nTaken = Math.floor(total * between(r, 0.18, 0.62));
  for(let i=0;i<nTaken;i++) taken.add(`${inti(r,1,cfg.rows)}${pick(r,cfg.cols.filter(Boolean))}`);
  const premRows = Math.max(1, Math.round(cfg.rows * 0.18));
  for(let rr=1; rr<=premRows; rr++) cfg.cols.filter(Boolean).forEach(c => prem.add(`${rr}${c}`));
  return {...cfg, taken:[...taken], prem:[...prem]};
}

/* ---------- flexible-date pricing strip ---------- */
function flexStrip(leg){
  const span = leg.flex|0;
  const days = [];
  for(let d=-span; d<=span; d++){
    const date = addDays(leg.date, d);
    if(date < todayISO) continue;
    let best = Infinity, bestMode = null;
    [...S.modes].forEach(m => {
      genOptions(leg, m, date).forEach(o => { if(!o.lastMile && o.total < best){ best = o.total; bestMode = m; } });
    });
    if(best < Infinity) days.push({date, best, bestMode, off: d});
  }
  return days;
}

/* ---------- aggregate counts + ranges per mode ---------- */
function modeSummary(leg, date){
  const out = {};
  MODEKEYS.forEach(m => {
    const o = genOptions(leg, m, date || leg.date);
    out[m] = o.length ? {
      count:o.length,
      min:Math.min(...o.map(x=>x.total)),
      max:Math.max(...o.map(x=>x.total)),
      fastest:Math.min(...o.map(x=>x.mins)),
      lastMile:o[0].lastMile
    } : {count:0};
  });
  return out;
}

   HOTELS — a stay at the destination of any leg
   ============================================================ */
const HOTEL_ADJ = ['Grand','Royal','Golden','Blue','Silver','Palm','Amber','Heritage','Emerald','Lotus','Crescent','Orchid','Sapphire','Cedar'];
const HOTEL_NOUN = ['Residency','Sarovar','Meridian','Courtyard','Plaza','Retreat','Gardens','Heights','Palace','Inn','Suites','Manor','Bywater','Terrace'];
const HOTEL_ROOMS = {2:['Standard room'],3:['Deluxe room','Standard room'],4:['Deluxe room','Executive room','Club room'],5:['Premier room','Suite','Club suite']};
const HOTEL_AMEN = ['Free Wi-Fi','Breakfast included','Swimming pool','Spa','Airport pickup','24-hour front desk','Gym','Parking','Rooftop restaurant','Air conditioning','Room service','Bar','Pet friendly','Business centre'];

function genHotels(cityKey, checkin){
  const r = rng(`${cityKey}hotel${checkin}`);
  const n = inti(r, 8, 13);
  const out = [];
  for(let i=0;i<n;i++){
    const stars = Math.max(2, Math.min(5, inti(r,2,5)));
    const name = `${pick(r,HOTEL_ADJ)} ${pick(r,HOTEL_NOUN)}`;
    const room = pick(r, HOTEL_ROOMS[stars]);
    const base = 1350 * STAR_MULT[stars] * between(r, 0.82, 1.32);
    const perNight = Math.round(base/50)*50;
    const rating = Math.min(5, Math.round((3.25 + stars*0.28 + r()*0.42)*10)/10);
    const reviews = inti(r, 120, 4200);
    const distanceKm = Math.round(between(r, 0.3, 9)*10)/10;
    const breakfast = r() < 0.5;
    const freeCancel = r() < 0.65;
    const amen = new Set(); let guard=0;
    while(amen.size < Math.min(HOTEL_AMEN.length, 3+stars) && guard++<40) amen.add(pick(r, HOTEL_AMEN));
    out.push({
      id:`hotel-${cityKey}-${checkin}-${i}`, name, stars, room, perNight, rating, reviews,
      distanceKm, breakfast, freeCancel, amen:[...amen], thumb: svgDataUri(hotelArt(cityKey+i))
    });
  }
  return out;
}
function hotelNightsFor(i){
  if(S.hotelNights[i] != null) return S.hotelNights[i];
  const next = S.legs[i+1];
  if(next){
    const d = Math.round((new Date(next.date+'T00:00:00') - new Date(S.legs[i].date+'T00:00:00')) / 86400000);
    return Math.max(1, d);
  }
  return 1;
}
function hotelRoomsFor(paxCount){ return Math.max(1, Math.ceil((paxCount||1)/3)); }

/* ---------- bundles ---------- */
function bundleFor(totalFare, paxCount, kind){
  const rules = {
    solo:   {n:'Solo Explorer',  pct:0.07, add:['Free seat pick on one leg','Metro day pass at destination','24×7 chat support'],      min:1},
    family: {n:'Family Four+',   pct:0.18, add:['Kids under 12 at 50% on trains and buses','One free date change','Airport cab at ₹99','Shared luggage allowance'], min:3},
    duo:    {n:'Two Together',   pct:0.11, add:['Seats guaranteed side by side','Free cancellation up to 48 h','One lounge pass'],      min:2}
  };
  const key = kind || (paxCount >= 3 ? 'family' : paxCount === 2 ? 'duo' : 'solo');
  const rule = rules[key];
  return {key, ...rule, save: Math.round(totalFare * rule.pct)};
}

    else if(phone.replace(/\D/g,'').length < 10) e = 'Mobile number needs at least 10 digits.';
    else if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) e = 'Email address is not valid.';
    $('#pfErr').textContent = e;
    if(e) return;
    const prev = S.profile;
    S.profile = {name, age, idType:$('#pfIdType').value, idNo, phone, email,
      kind:$('#pfKind').value, seatPref:$('#pfSeat').value, points: prev?.points ?? 1240, family: prev?.family ?? []};
    save(); renderProfBar();
    toast(prev? 'Profile updated' : 'Profile created — booking unlocked');
    aiSay(`Profile ready, ${name.split(' ')[0]}. You are <b>${tierOf(S.profile.points).n}</b> with ${S.profile.points.toLocaleString('en-IN')} points. I will apply that to every fare I quote.`);
    go('plan');
  });
}

function modeCards(leg){

const fmtMins = m => `${Math.floor(m/60)}h ${pad(m%60)}m`;

function diffTable(leg){

  const lm = MODEKEYS.filter(m=>sum[m].count && sum[m].lastMile);
  const fast = Math.min(...live.map(m=>sum[m].fastest));

  return `<h3 style="font-size:19px">Distance and time, side by side</h3>

      const s=sum[m], o=genOptions(leg,m,leg.date);

      return `<tr style="border-top:1px solid var(--ridge)">

        <td>${km.toLocaleString('en-IN')} km</td>

        <td style="color:${d===0?'var(--good)':'var(--haze)'}">${d===0?'fastest':'+'+fmtMins(d)}</td>
        <td style="color:${s.min===cheap?'var(--good)':'inherit'}">${money(s.min)}</td></tr>`;
    }).join('')}</tbody></table></div>
  ${lm.length?`<p class="note" style="margin-top:10px">Metro cannot run this leg at ${distKm(leg.from,leg.to).toLocaleString('en-IN')} km. ${sum.metro.count} last-mile metro hops are available inside ${CITIES[leg.to].n}, from ${money(sum.metro.min)} — add one to whatever you take.</p>`:''}`;
}

function wirePlan(){
  cycleHero();

function currentPool(leg){
  let pool = [];
  [...S.modes].forEach(m => pool = pool.concat(genOptions(leg, m, leg.date)));
  return pool;
}
function filtered(pool){
  const f = S.filters;
  // a last-mile metro hop is an add-on at the destination, not a way to run the leg,
  // so it only appears when metro is the chosen filter
  let out = pool.filter(o => (f.mode==='all' ? !o.lastMile : o.mode===f.mode) && o.stars >= f.minStars);
  if(f.cap) out = out.filter(o => o.total <= f.cap);
  const key = {cheap:(a,b)=>a.total-b.total, fast:(a,b)=>a.mins-b.mins, star:(a,b)=>b.stars-a.stars||a.total-b.total,
               value:(a,b)=>(a.total/a.stars)-(b.total/b.stars), early:(a,b)=>a.dep-b.dep}[f.sort];
  return out.sort(key);
}

/* price-vs-typical badge and strongest pricing factor */
function priceLevelBadge(o){
  if(o._lvl == null) return '';
  const pct = Math.round((o._lvl-1)*100);
  if(pct <= -12) return `<div style="font-size:11px;font-weight:700;color:var(--good);margin-top:3px">▼ ${Math.abs(pct)}% below usual</div>`;
  if(pct >= 15)  return `<div style="font-size:11px;font-weight:700;color:var(--ember);margin-top:3px">▲ ${pct}% above usual</div>`;
  return `<div style="font-size:11px;color:var(--dim);margin-top:3px">typical price</div>`;
}
function topFactorTag(o){
  if(!o.factors || !o.factors.length) return '';
  const f = o.factors.filter(x=>!/^Operator pricing$|^Standard rate$/.test(x.label)).sort((a,b)=>Math.abs(b.pct)-Math.abs(a.pct))[0];
  if(!f) return '';
  return `<span class="tag ${f.pct>0?'em':'gd'}">${f.label} ${f.pct>0?'+':'−'}${Math.abs(f.pct)}%</span>`;
}

        <div class="otime">
          <span class="t">${fmtClock(o.dep)}</span>
          <span class="track"></span>

          ${o.amen.slice(0,3).map(a=>`<span class="tag">${a}</span>`).join('')}

          ${topFactorTag(o)}
          <span class="tag gd">live tracker</span>

/* ---------- live tracker — every vehicle type ---------- */
const TRACK_CONF = {
  flight:{label:'Live flight tracker', unit:'km/h', cruiseWord:'cruising altitude', idle:'on stand'},
  train: {label:'Live speed detection', unit:'km/h', cruiseWord:'cruising', idle:'at platform'},
  bus:   {label:'Live road tracker',    unit:'km/h', cruiseWord:'cruising', idle:'at stop'},
  car:   {label:'Live trip tracker',    unit:'km/h', cruiseWord:'cruising', idle:'stationary'},
  metro: {label:'Live metro tracker',   unit:'km/h', cruiseWord:'in motion', idle:'at station'}
};
let speedTimer = null, speedHist = [], trackTick = 0;
function speedTarget(leg, forced){
  if(forced) return forced;
  const pick = S.picks[S.activeLeg];
  if(pick) return pick;
  const pool = currentPool(leg);
  return pool.length ? pool.slice().sort((a,b)=>a.total-b.total)[0] : null;
}
function cruiseAltFor(t){
  const r = rng(t.id||(t.opName+t.dep));
  return Math.round((310 + r()*100)) * 100; // 31,000–41,000 ft
}
function altitudeAt(pct, cruise){
  if(pct < 14) return Math.round(cruise * Math.min(1, pct/14));
  if(pct > 86) return Math.round(cruise * Math.max(0, (100-pct)/14));
  return cruise;
}
function nextStopFor(t){
  const names = ['Central','Junction','Market','Riverside','Fort','Terminal','University','Park'];
  const r = rng((t.id||t.opName)+'stop');
  return pick(r, names);
}
function speedPanel(leg, forced){
  const t = speedTarget(leg, forced);
  if(!t) return `<h3 style="font-size:17px">Live tracker</h3><p class="note" style="margin-top:6px">Choose a vehicle on this leg to open its live tracker.</p>`;
  const conf = TRACK_CONF[t.mode];
  const isFlight = t.mode==='flight', isRoad = t.mode==='bus'||t.mode==='car', isMetro = t.mode==='metro';
  return `<h3 style="font-size:17px">${conf.label}</h3>
    <div class="note" style="margin:6px 0 12px">${t.opName} ${t.code} · GPS ping every 4 s</div>
    <div class="gauge"><span class="v" id="spdV">0</span><span class="u">${conf.unit}</span>
      <span class="note" style="margin-left:auto" id="spdS">acquiring</span></div>
    <div class="bar" style="margin:10px 0"><i id="spdBar" style="width:0%"></i></div>
    <div class="spark" id="spdSpark">${Array.from({length:22},()=>'<i style="height:4px"></i>').join('')}</div>
    <div class="note" style="display:flex;justify-content:space-between;margin:8px 0 2px"><span>Route progress</span><b id="spdPct" style="color:var(--paper)">0%</b></div>
    <div class="bar"><i id="spdProg" style="width:0%;background:linear-gradient(90deg,var(--haze),var(--amber))"></i></div>
    ${isFlight?`<div class="kv"><span>Altitude</span><b id="spdAlt">0 ft</b></div>`:''}
    ${isMetro?`<div class="kv"><span>Next station</span><b id="spdNext">${esc(nextStopFor(t))}</b></div>`:''}
    <div class="kv"><span>Average for this run</span><b>${t.avgSpeed} km/h</b></div>
    <div class="kv"><span>${isFlight?'Cruise speed cap':isRoad?'Speed limit':'Section limit'}</span><b>${t.topSpeed} km/h</b></div>
    <div class="kv"><span>${isRoad?'ETA':'Running status'}</span><b id="spdStat" style="color:var(--good)">on time</b></div>`;
}
function startSpeed(forced){
  clearInterval(speedTimer);
  if(!$('#spdV')) return;
  const t = speedTarget(S.legs[S.activeLeg], forced);
  if(!t) return;
  const conf = TRACK_CONF[t.mode];
  const isFlight = t.mode==='flight', isMetro = t.mode==='metro';
  const cruise = isFlight ? cruiseAltFor(t) : 0;
  const totalTicks = 150;
  trackTick = Math.floor(Math.random()*40);
  let v = t.avgSpeed * 0.4, phase = 0;
  speedHist = Array.from({length:22},(_,k)=> t.avgSpeed*(0.62+0.4*Math.abs(Math.sin(k*0.55))));
  speedTimer = setInterval(()=>{
    phase += 0.35; trackTick++;
    const pct = Math.min(99, trackTick/totalTicks*100);
    const nearEnd = pct > 90, justStarted = pct < 6;
    const target = (justStarted||nearEnd) ? t.avgSpeed*0.35 : t.avgSpeed * (0.72 + 0.42*Math.abs(Math.sin(phase*0.7)));
    v += (target - v) * 0.34 + (Math.random()-0.5)*5;
    v = Math.max(0, Math.min(t.topSpeed, v));
    speedHist.push(v); if(speedHist.length>22) speedHist.shift();
    const el = $('#spdV'); if(!el){ clearInterval(speedTimer); return; }
    el.textContent = Math.round(v);
    $('#spdBar').style.width = Math.min(100, v/t.topSpeed*100) + '%';
    $('#spdPct').textContent = Math.round(pct) + '%';
    $('#spdProg').style.width = pct + '%';
    if(isFlight){ const alt = altitudeAt(pct, cruise); const a=$('#spdAlt'); if(a) a.textContent = alt.toLocaleString('en-IN')+' ft'; }
    if(isMetro){ const n=$('#spdNext'); if(n && trackTick%38===1) n.textContent = nextStopFor({...t, id:t.id+trackTick}); }
    $('#spdS').textContent = v < 8 ? conf.idle : nearEnd ? (isFlight?'on approach':'arriving shortly') : justStarted ? 'departing' : conf.cruiseWord;
    $('#spdStat').textContent = v < 8 ? 'signal hold, 3 min' : nearEnd ? 'nearing destination' : 'on time';
    $('#spdStat').style.color = v < 8 ? 'var(--warn)' : 'var(--good)';
    const sp = $('#spdSpark');
    if(sp) sp.innerHTML = speedHist.map(h=>`<i style="height:${Math.max(3, h/t.topSpeed*44)}px"></i>`).join('');
  }, 850);
}

/* ============================================================
   MAPS
   ============================================================ */
function mapShell(inner, w=380, h=260){
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="route schematic">
    <defs>
      <pattern id="gr" width="26" height="26" patternUnits="userSpaceOnUse">
        <path d="M26 0H0v26" fill="none" stroke="var(--ridge)" stroke-width=".6" opacity=".55"/></pattern>
      <linearGradient id="rt" x1="0" x2="1"><stop offset="0" stop-color="var(--ember)"/><stop offset="1" stop-color="var(--amber)"/></linearGradient>
    </defs>
    <rect width="${w}" height="${h}" fill="url(#gr)" rx="10"/>${inner}</svg>`;
}
const MX = (x,w=380)=> 16 + (x/100)*(w-32);
const MY = (y,h=260)=> 16 + (y/100)*(h-32);

function networkMap(legs){
  const used = [...new Set(legs.flatMap(l=>[l.from,l.to]))];
  const path = legs.map(l=>{
    const x1=MX(CITIES[l.from].x),y1=MY(CITIES[l.from].y),x2=MX(CITIES[l.to].x),y2=MY(CITIES[l.to].y);
    const mx=(x1+x2)/2, my=(y1+y2)/2 - Math.hypot(x2-x1,y2-y1)*0.18;
    return `<path d="M${x1} ${y1} Q${mx} ${my} ${x2} ${y2}" fill="none" stroke="url(#rt)" stroke-width="2.2" stroke-linecap="round"/>`;
  }).join('');
  const dots = used.map(c=>{
    const x=MX(CITIES[c].x), y=MY(CITIES[c].y);
    return `<circle cx="${x}" cy="${y}" r="4.5" fill="var(--amber)"/><circle cx="${x}" cy="${y}" r="9" fill="none" stroke="var(--amber)" stroke-width=".8" opacity=".4"/>
      <text x="${x+11}" y="${y+4}" font-size="10.5" fill="var(--paper)" font-family="Archivo">${CITIES[c].n}</text>`;
  }).join('');
  return mapShell(path + dots);
}

function routeMap(leg, mode){
  const w=380,h=230;
  const x1=MX(CITIES[leg.from].x,w), y1=MY(CITIES[leg.from].y,h);
  const x2=MX(CITIES[leg.to].x,w),   y2=MY(CITIES[leg.to].y,h);
  const km = distKm(leg.from,leg.to);
  let line='', label='';
  if(mode==='flight'){
    const mx=(x1+x2)/2, my=(y1+y2)/2 - Math.hypot(x2-x1,y2-y1)*0.42;
    line = `<path d="M${x1} ${y1} Q${mx} ${my} ${x2} ${y2}" fill="none" stroke="url(#rt)" stroke-width="2.4" stroke-dasharray="7 5"/>
      <circle cx="${mx}" cy="${(y1+y2)/2-Math.hypot(x2-x1,y2-y1)*0.21}" r="3" fill="var(--paper)"/>`;
    label='Great-circle air corridor · no intermediate stops';
  } else if(mode==='metro'){
    return metroMap(leg.to);
  } else {
    const wobble = mode==='car'?10:mode==='bus'?7:4;
    const n=4, pts=[];
    for(let i=0;i<=n;i++){
      const t=i/n;
      pts.push([x1+(x2-x1)*t + (i%2?wobble:-wobble)*(i&&i<n?1:0), y1+(y2-y1)*t + (i%2?-wobble:wobble)*(i&&i<n?1:0)]);
    }
    line = `<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="url(#rt)" stroke-width="2.6" stroke-linejoin="round"/>` +
      pts.slice(1,-1).map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--haze)"/>`).join('');
    label = mode==='train' ? 'Rail alignment with 3 intermediate halts'
          : mode==='bus' ? 'Highway route with scheduled rest stops'
          : 'Road route, tolls included in the estimate';
  }
  const ends = `<circle cx="${x1}" cy="${y1}" r="5" fill="var(--amber)"/><text x="${x1+10}" y="${y1+4}" font-size="11" fill="var(--paper)">${CITIES[leg.from].n}</text>
    <circle cx="${x2}" cy="${y2}" r="5" fill="var(--ember)"/><text x="${x2+10}" y="${y2+4}" font-size="11" fill="var(--paper)">${CITIES[leg.to].n}</text>
    <text x="16" y="${h-10}" font-size="10" fill="var(--dim)">${MODES[mode].n} · ${km.toLocaleString('en-IN')} km · ${label}</text>`;
  return mapShell(line+ends, w, h);
}

const LINECOL = ['#E8544A','#3D7BE8','#4CB07A','#E0A83C','#A05BD6','#2FB5C4'];
function metroMap(cityKey){
  const c = CITIES[cityKey];
  if(!c.metro.length) return `<div class="note" style="padding:14px">${c.n} has no metro network. Local transfers run on cabs and buses.</div>`;
  const w=380, h= 42 + c.metro.length*52;
  const names = ['Central','Junction','Museum','Market','Park','Airport','Riverside','University','Fort','Terminal'];
  const rows = c.metro.map((ln,i)=>{
    const y = 34 + i*52, col = LINECOL[i%LINECOL.length];
    const n = 5 + (i%2);
    const stops = Array.from({length:n},(_,k)=>{
      const x = 44 + k*((w-88)/(n-1));
      const inter = (k===2);
      return `<circle cx="${x}" cy="${y}" r="${inter?6:4}" fill="${inter?'var(--night)':col}" stroke="${col}" stroke-width="2.4"/>
        <text x="${x}" y="${y+18}" font-size="8.5" fill="var(--dim)" text-anchor="middle">${names[(i*3+k)%names.length]}</text>`;
    }).join('');
    return `<line x1="44" y1="${y}" x2="${w-44}" y2="${y}" stroke="${col}" stroke-width="5" stroke-linecap="round"/>
      ${stops}<text x="8" y="${y+4}" font-size="9.5" fill="${col}" font-weight="600">${ln}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${c.n} metro lines">
    <rect width="${w}" height="${h}" fill="transparent"/>${rows}
    <text x="8" y="${h-6}" font-size="9" fill="var(--dim)">${c.metro.length} lines · hollow marker = interchange · token from ₹12</text></svg>`;
}

/* ---------- cabin camera renderer ---------- */
const CAMPAL = {
  flight:{sky:['#F7C87A','#D9694A'], wall:'#2C2733', seat:'#3A3242', trim:'#6F6280', floor:'#241F2C'},
  train :{sky:['#9FD2F0','#3E7FB8'], wall:'#2A2E38', seat:'#B33A32', trim:'#E0E4EA', floor:'#20242C'},
  bus   :{sky:['#FFD79A','#C4623C'], wall:'#2E2A30', seat:'#4A3F50', trim:'#C9A86A', floor:'#231F26'},
  car   :{sky:['#F2B266','#9E4B3C'], wall:'#262029', seat:'#3E2F35', trim:'#C08A50', floor:'#1E1A22'},
  metro :{sky:['#CFE3F5','#5A86B5'], wall:'#252A31', seat:'#2E6E8E', trim:'#DCE6EE', floor:'#1D2127'}
};
function idleCam(){
  const cv=$('#cam'); if(!cv) return;
  const g=cv.getContext('2d'); g.fillStyle='#0A0810'; g.fillRect(0,0,cv.width,cv.height);
  g.fillStyle='#4A4056'; g.font='500 16px Archivo'; g.textAlign='center';
  g.fillText('Camera standing by — select a seat', cv.width/2, cv.height/2);
}
function stopCam(){ if(camRAF) cancelAnimationFrame(camRAF); camRAF=null; }
function openCam(seatId){
  camSeat = seatId;
  const o = S.picks[S.activeLeg];
  const note=$('#camNote'); if(note) note.textContent = `View from ${seatId} — ${o.rows.prem.includes(seatId)?'extra legroom row':'standard row'}, ${/A|1|F/.test(seatId.slice(-1))?'window side':'inboard'}.`;
  const idEl=$('#camId'); if(idEl) idEl.textContent = `CAM ${MODES[o.mode].n.toUpperCase()}-${seatId}`;
  const se=$('#camSeat'); if(se) se.textContent = `SEAT ${seatId}`;
  stopCam(); runCam(o.mode, seatId);
}
function runCam(mode, seatId){
  const cv=$('#cam'); if(!cv) return;
  const g=cv.getContext('2d'), W=cv.width, H=cv.height, P=CAMPAL[mode];
  const col = seatId.slice(-1), row = parseInt(seatId);
  const side = ['A','1','F'].includes(col) ? -1 : ['F','4','D','R2'].includes(col) ? 1 : (row%2?-1:1);
  let t=0;
  const draw = ()=>{
    t += 0.016;
    const bob = Math.sin(t*1.7)*1.6, sway = Math.sin(t*0.9)*3;
    g.clearRect(0,0,W,H);
    // wall
    g.fillStyle=P.wall; g.fillRect(0,0,W,H);
    // vanishing corridor
    const vx = W/2 - side*36 + sway, vy = H*0.46 + bob;
    // floor
    g.fillStyle=P.floor; g.beginPath(); g.moveTo(0,H); g.lineTo(W,H); g.lineTo(vx+70,vy+14); g.lineTo(vx-70,vy+14); g.closePath(); g.fill();
    // ceiling
    g.fillStyle='rgba(255,255,255,.04)'; g.beginPath(); g.moveTo(0,0); g.lineTo(W,0); g.lineTo(vx+110,vy-52); g.lineTo(vx-110,vy-52); g.closePath(); g.fill();
    // windows on both sides, receding
    for(let i=0;i<5;i++){
      const d = i/5, s = 1-d*0.78;
      const wy = vy - 58*s, wh = 74*s, ww = 58*s;
      [-1,1].forEach(sg=>{
        const wx = vx + sg*(96 + i*86)*s*1.5;
        if(wx < -60 || wx > W+60) return;
        const grd = g.createLinearGradient(0,wy,0,wy+wh);
        const shift = (Math.sin(t*0.6 + i)*0.5+0.5);
        grd.addColorStop(0, P.sky[0]); grd.addColorStop(1, P.sky[1]);
        g.save();
        g.globalAlpha = 0.92;
        roundRect(g, wx-ww/2, wy, ww, wh, 10*s); g.fillStyle=grd; g.fill();
        // moving scenery band
        g.clip();
        g.fillStyle='rgba(0,0,0,.22)';
        for(let k=0;k<4;k++){
          const sx = ((t*(mode==='flight'?14:120) + k*54 + i*20) % (ww+70)) - 35;
          g.fillRect(wx-ww/2+sx, wy+wh*0.55 - k*3, 16*s, wh);
        }
        g.restore();
        g.strokeStyle='rgba(255,255,255,.18)'; g.lineWidth=2*s;
        roundRect(g, wx-ww/2, wy, ww, wh, 10*s); g.stroke();
        // light spill
        const spill = g.createRadialGradient(wx, wy+wh/2, 2, wx, wy+wh/2, 150*s);
        spill.addColorStop(0, `rgba(255,214,150,${0.20*(0.8+0.2*shift)})`); spill.addColorStop(1,'rgba(255,214,150,0)');
        g.fillStyle=spill; g.fillRect(wx-150*s, wy-60*s, 300*s, 200*s);
      });
    }
    // seat rows receding
    for(let i=5;i>=0;i--){
      const d=i/6, s=1-d*0.74, alpha=1-d*0.35;
      const by = H*0.99 - (H*0.5)*d - 30*s + bob*(1-d);
      const bh = 118*s, bw = 96*s;
      const n = mode==='car'?2:2;
      for(let sg=-1; sg<=1; sg+=2){
        for(let k=0;k<n;k++){
          const bx = vx + sg*(52 + k*92)*s*1.28 + sway*(1-d);
          g.globalAlpha = alpha;
          roundRect(g, bx-bw/2, by-bh, bw, bh, 14*s);
          g.fillStyle = P.seat; g.fill();
          g.strokeStyle = 'rgba(255,255,255,.08)'; g.lineWidth=1.5; g.stroke();
          // headrest
          roundRect(g, bx-bw/2+8*s, by-bh-2, bw-16*s, 26*s, 9*s); g.fillStyle=P.trim; g.globalAlpha=alpha*0.5; g.fill();
          g.globalAlpha = alpha;
        }
      }
      g.globalAlpha=1;
    }
    // your seat highlight in foreground
    const hx = W/2 + side*118, hy = H*0.985;
    g.save();
    g.globalAlpha = 0.55 + Math.sin(t*2.6)*0.18;
    g.strokeStyle='#F2A33C'; g.lineWidth=3; g.setLineDash([9,6]);
    roundRect(g, hx-92, hy-148, 184, 150, 18); g.stroke();
    g.restore();
    g.fillStyle='#F2A33C'; g.font='700 15px Archivo'; g.textAlign='center';
    g.fillText(seatId, hx, hy-158);
    // vignette + grain
    const vg = g.createRadialGradient(W/2,H/2,H*0.25,W/2,H/2,H*0.95);
    vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.72)');
    g.fillStyle=vg; g.fillRect(0,0,W,H);
    const ct=$('#camTime');
    if(ct){ const d=new Date(); ct.textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
    camRAF = requestAnimationFrame(draw);
  };
  draw();
}
function roundRect(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
/* ============================================================
   REVIEW + CONFIRM
   ============================================================ */
function totals(){
  const per = S.legs.reduce((a,_,i)=> a + (S.picks[i]?.total||0), 0);
  const paxN = S.passengers.length;
  let gross = 0;
  S.legs.forEach((_,i)=>{
    const o = S.picks[i];
    if(!o) return;
    if(o.perVehicle){ gross += o.total * Math.ceil(paxN/4); return; }
    S.passengers.forEach(p=>{
      const age = +p.age;
      let f = o.total;
      if(age < 5 && o.mode!=='flight') f = 0;
      else if(age < 12 && (o.mode==='train'||o.mode==='bus')) f *= 0.5;
      else if(age >= 60 && o.mode==='train') f *= 0.96;
      gross += f;
    });
  });
  let hotelGross = 0;
  S.legs.forEach((_,i)=>{
    const h = S.hotels[i]; if(!h) return;
    hotelGross += h.perNight * hotelNightsFor(i) * hotelRoomsFor(paxN);
  });
  gross += hotelGross;
  const b = bundleFor(gross, paxN, S.bundle);
  const pts = Math.round(gross * tierOf(S.profile?.points||0).earn);
  return {per, gross:Math.round(gross), bundle:b, net:Math.round(gross - b.save), pts, hotelGross:Math.round(hotelGross)};
}

function refundFor(bk){
  const dep = new Date(bk.legs[0].date + 'T00:00:00').getTime() + bk.legs[0].opt.dep*60000;
  const hrs = (dep - Date.now())/3600000;
  if(hrs < 0)  return {pct:0,   band:'after departure', hrs};
  if(hrs < 24) return {pct:0.25,band:'under 24 hours to departure', hrs};
  if(hrs < 48) return {pct:0.60,band:'24 to 48 hours to departure', hrs};
  return {pct:0.95, band:'more than 48 hours to departure', hrs};
}

// index 4 is the silhouette ink — kept much darker than the sky so shapes read
const ART_PAL = [
  ['#2B1B3D','#6E2C55','#D9694A','#F7C87A','#150D20'],
  ['#12263A','#2E5B6E','#5FA8A0','#EFD9A4','#081420'],
  ['#3A1F1B','#7A3B2E','#C97B3C','#F2C879','#1C0E0C'],
  ['#1B2447','#3D4B85','#8A6FB5','#E9B7C4','#0D1228'],
  ['#14301F','#2E5B3C','#7FA35C','#E6D191','#08180F']
];
function art(kind, seed){
  const r = rng(kind+seed), P = pick(r, ART_PAL);
  const W=400,H=200, sunY = 52+r()*34, sunX = 80+r()*240;
  const INK = P[4], MID = P[0];
  let sil='';
  const g = (d,c,o)=>`<path d="${d}" fill="${c}" opacity="${o||1}"/>`;
  const hills = (y,c)=>g(`M0 ${H} L0 ${y+18} Q60 ${y-22} 120 ${y+6} Q190 ${y-30} 255 ${y+10} Q330 ${y-16} 400 ${y+4} L400 ${H} Z`, c);
  if(kind==='dome'){
    sil = hills(150,MID) + g(`M150 ${H} L150 130 Q200 78 250 130 L250 ${H} Z`,INK) +
      g(`M196 78 L200 54 L204 78 Z`,P[3]) + g(`M160 130 L160 100 L172 100 L172 130 Z`,INK) +
      g(`M228 130 L228 100 L240 100 L240 130 Z`,INK) + g(`M110 ${H} L110 142 L134 142 L134 ${H} Z`,INK);
  } else if(kind==='fort'){
    sil = hills(146,MID) + g(`M96 ${H} L96 120 L112 120 L112 106 L128 106 L128 120 L176 120 L176 100 L192 100 L192 120 L272 120 L272 130 L288 130 L288 ${H} Z`,INK) +
      g(`M136 ${H} L136 136 L156 136 L156 ${H} Z`,MID);
  } else if(kind==='city'){
    let b=''; for(let i=0;i<13;i++){ const x=20+i*29, h=40+r()*92; b += g(`M${x} ${H} L${x} ${H-h} L${x+22} ${H-h} L${x+22} ${H} Z`, i%3?INK:MID);
      for(let k=0;k<4;k++) b+= `<rect x="${x+4}" y="${H-h+10+k*16}" width="5" height="6" fill="${P[3]}" opacity=".5"/>`; }
    sil = b;
  } else if(kind==='beach'){
    sil = g(`M0 150 L400 150 L400 ${H} L0 ${H} Z`, MID) +
      `<path d="M0 150 Q100 158 200 150 Q300 142 400 150 L400 ${H} L0 ${H} Z" fill="${P[2]}" opacity=".35"/>` +
      g(`M40 ${H} L44 132 L48 ${H} Z`,INK) + g(`M44 132 Q22 120 16 134 Q36 128 44 136 Q52 120 74 130 Q56 118 44 132 Z`,INK);
  } else if(kind==='hills'){
    sil = hills(120,MID) + hills(152,INK);
  } else if(kind==='cave'){
    sil = g(`M0 ${H} L0 90 L400 90 L400 ${H} Z`,MID) +
      g(`M140 ${H} L140 130 Q200 84 260 130 L260 ${H} Z`,'#0B0910') +
      g(`M0 90 L400 90 L400 104 Q200 78 0 104 Z`,INK);
  } else if(kind==='rail'){
    sil = hills(150,MID) + g(`M0 176 L400 176 L400 182 L0 182 Z`,INK) +
      g(`M60 176 L60 132 Q60 118 84 118 L200 118 Q216 118 216 134 L216 176 Z`,INK) +
      `<rect x="78" y="132" width="26" height="20" fill="${P[3]}" opacity=".7"/><rect x="118" y="132" width="26" height="20" fill="${P[3]}" opacity=".7"/>`;
  } else if(kind==='waterfall'){
    sil = hills(126,MID) + g(`M176 96 L224 96 L214 ${H} L186 ${H} Z`, P[3]) +
      g(`M0 ${H} L0 160 Q120 150 176 168 L224 168 Q300 150 400 162 L400 ${H} Z`,INK);
  } else { // ghat
    sil = g(`M0 ${H} L0 140 L400 140 L400 ${H} Z`,MID);
    for(let i=0;i<6;i++) sil += g(`M${i*70} ${H} L${i*70} ${140+i*6} L${i*70+62} ${140+i*6} L${i*70+62} ${H} Z`,INK);
    sil += g(`M30 140 L30 106 Q46 90 62 106 L62 140 Z`,INK) + g(`M300 140 L300 112 L330 112 L330 140 Z`,INK);
  }
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax slice" role="img">
    <defs><linearGradient id="sk${seed}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${P[0]}"/><stop offset=".55" stop-color="${P[2]}"/><stop offset="1" stop-color="${P[3]}"/></linearGradient>
      <radialGradient id="su${seed}"><stop offset="0" stop-color="#FFF3D0"/><stop offset="1" stop-color="${P[3]}" stop-opacity="0"/></radialGradient></defs>
    <rect width="${W}" height="${H}" fill="url(#sk${seed})"/>
    <circle cx="${sunX}" cy="${sunY}" r="40" fill="url(#su${seed})"/>
    <circle cx="${sunX}" cy="${sunY}" r="15" fill="#FFF6DC" opacity=".9"/>
    ${sil}
  </svg>`;
}

/* ---------- hotel illustration (dusk facade, lit windows) ---------- */
function hotelArt(seed){
  const r = rng('hotel'+seed), P = pick(r, ART_PAL);
  const W=400, H=200, INK=P[4], MID=P[0];
  const sunY = 46+r()*18, sunX = 50+r()*300;
  const bw = 150+r()*70, bx = W/2 - bw/2 + (r()-0.5)*50, by = 42+r()*12, bh = H-by-30;
  const cols = 6+Math.floor(r()*3), rows = 5+Math.floor(r()*3);
  let windows = '';
  for(let cx=0; cx<cols; cx++){
    for(let cy=0; cy<rows; cy++){
      const wx = bx+9+cx*((bw-18)/cols), wy = by+13+cy*((bh-26)/rows);
      const lit = r() < 0.4;
      windows += `<rect x="${wx.toFixed(1)}" y="${wy.toFixed(1)}" width="${((bw-18)/cols-4).toFixed(1)}" height="${((bh-26)/rows-5).toFixed(1)}" rx="1" fill="${lit?'#FFE3A6':INK}" opacity="${lit?0.92:0.5}"/>`;
    }
  }
  const canopy = `<path d="M${(bx-16).toFixed(1)} ${(by+bh).toFixed(1)} L${(bx+bw+16).toFixed(1)} ${(by+bh).toFixed(1)} L${(bx+bw).toFixed(1)} ${(by+bh-15).toFixed(1)} L${bx.toFixed(1)} ${(by+bh-15).toFixed(1)} Z" fill="${P[3]}" opacity=".82"/>`;
  const ground = `<rect x="0" y="${(by+bh).toFixed(1)}" width="${W}" height="${(H-(by+bh)).toFixed(1)}" fill="${MID}" opacity=".5"/>`;
  const wing = r()<0.5 ? `<rect x="${(bx-46).toFixed(1)}" y="${(by+bh*0.4).toFixed(1)}" width="34" height="${(bh*0.6).toFixed(1)}" fill="${INK}" opacity=".85"/>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax slice" role="img">
    <defs><linearGradient id="hs${seed}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${P[0]}"/><stop offset=".55" stop-color="${P[2]}"/><stop offset="1" stop-color="${P[3]}"/></linearGradient>
      <radialGradient id="hu${seed}"><stop offset="0" stop-color="#FFF3D0"/><stop offset="1" stop-color="${P[3]}" stop-opacity="0"/></radialGradient></defs>
    <rect width="${W}" height="${H}" fill="url(#hs${seed})"/>
    <circle cx="${sunX.toFixed(1)}" cy="${sunY.toFixed(1)}" r="34" fill="url(#hu${seed})"/>
    ${wing}
    <rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="${INK}"/>
    ${windows}
    ${canopy}
    ${ground}
  </svg>`;
}

let exploreCity = null, exploreCat = 'all';
function viewExplore(){
  const dest = exploreCity || (S.legs[S.legs.length-1]?.to) || 'HYD';

const AI_CHIPS = ['Cheapest way to do this trip','Flight or train?','Do I need a visa?','Can I change my seat?','What should I see there?','Explain my refund'];
function openAI(){ $('#aiPanel').classList.add('open'); $('#aiInput').focus(); }
function aiSay(html){
  S.aiLog.push({r:'a',t:html});
  const b=$('#aiBody'); if(!b) return;
  const d=document.createElement('div'); d.className='msg a'; d.innerHTML=html; b.appendChild(d); b.scrollTop=b.scrollHeight;
  const fab=$('#aiFab'); if(!$('#aiPanel').classList.contains('open')) fab.style.boxShadow='0 0 0 3px rgba(242,163,60,.5),0 12px 30px rgba(43,124,245,.4)';
}
function aiUser(t){
  const b=$('#aiBody'); const d=document.createElement('div'); d.className='msg u'; d.textContent=t; b.appendChild(d); b.scrollTop=b.scrollHeight;
}
function aiOpinion(o, pool){
  const cheaper = pool.filter(x=>x.total < o.total);
  const faster = pool.filter(x=>x.mins < o.mins);
  if(!cheaper.length) return 'That is the cheapest thing on the board for this leg.';
  const c = cheaper.sort((a,b)=>a.total-b.total)[0];
  const f = faster.sort((a,b)=>a.mins-b.mins)[0];
  if(f && f.mode!==o.mode && f.mins < o.mins*0.6){
    const diff = f.total - o.total;
    const cost = diff >= 0 ? `${money(diff)} more` : `${money(-diff)} less`;
    return `${MODES[f.mode].n} would save you ${fmtMins(o.mins-f.mins)} for ${cost} — worth a look.`;
  }
  return `${c.opName} is ${money(o.total-c.total)} cheaper at ${c.stars}★ if budget matters more than comfort.`;
}
function aiAnswer(q){
  const t = q.toLowerCase();
  const leg = S.legs[S.activeLeg] || S.legs[0];
  const dest = CITIES[leg.to];

  if(/visa|passport|document|entry|border/.test(t)){
    const v = VISA[dest.c] || VISA.India;
    return `For <b>${dest.n}, ${dest.c}</b>: ${v.v}.<br><br>Carry: ${v.docs.join('; ')}.<br><br>Health note: ${v.health} Currency is ${v.cur}.`;
  }
  if(/seat.*(change|swap|move)|change.*seat/.test(t)){
    return `Seat changes are restricted once a booking is confirmed — this fare class does not allow a swap, and held inventory goes to standby at check-in. Your two real options are cancelling and rebooking at the live fare, or asking at the counter on the day for a courtesy swap in the same class.`;
  }
  if(/refund|cancel/.test(t)){
    const bk = S.bookings.find(b=>b.status==='confirmed');
    if(!bk) return `Refunds slide with time: 95% more than 48 hours out, 60% between 24 and 48 hours, 25% inside 24 hours, nothing after departure. Choose the travel wallet at cancellation and you get 10% more than the cash refund, instantly.`;
    const r = refundFor(bk);
    return `On <b>${bk.pnr}</b> you are ${r.band}, so the band is ${Math.round(r.pct*100)}% — ${money(bk.total*r.pct)} back to source, or ${money(bk.total*r.pct*1.1)} if you take it as travel wallet credit.`;
  }
  if(/cheap|budget|save|money|low/.test(t)){
    const pool = currentPool(leg).sort((a,b)=>a.total-b.total);
    const c = pool[0];
    const flex = flexStrip(leg), low = flex.sort((a,b)=>a.best-b.best)[0];
    return `Cheapest on ${CITIES[leg.from].n} → ${dest.n} right now is <b>${c.opName}</b>, ${MODES[c.mode].n.toLowerCase()}, ${money(c.total)} at ${c.stars}★ and ${fmtMins(c.mins)}.` +
      (low && low.date!==leg.date ? ` Shifting to ${prettyDate(low.date)} drops it to ${money(low.best)}.` : ` Your date is already the cheapest in the flexible window.`) +
      ` A ${bundleFor(1000,S.passengers.length||1).n} bundle takes another ${Math.round(bundleFor(1000,S.passengers.length||1).pct*100)}% off the total.`;
  }
  if(/flight|train|bus|car|metro|which|vs|better|compare/.test(t)){
    const sum = modeSummary(leg);
    const live = MODEKEYS.filter(m => sum[m].count && !sum[m].lastMile);
    if(!live.length) return `Nothing runs the full ${CITIES[leg.from].n} to ${dest.n} leg with your current vehicle selection. Turn more categories back on from the plan screen.`;
    const fast = [...live].sort((a,b)=>sum[a].fastest-sum[b].fastest)[0];
    const cheap = [...live].sort((a,b)=>sum[a].min-sum[b].min)[0];
    const head = `Over ${distKm(leg.from,leg.to).toLocaleString('en-IN')} km: <b>${MODES[fast].n}</b> is quickest at ${fmtMins(sum[fast].fastest)} from ${money(sum[fast].min)}`;
    if(fast === cheap) return head + `, and it is also the cheapest on the board. Nothing to weigh up — take it.`;
    const dT = sum[cheap].fastest - sum[fast].fastest, dM = sum[fast].min - sum[cheap].min;
    return head + `, while <b>${MODES[cheap].n}</b> starts at ${money(sum[cheap].min)} and takes ${fmtMins(sum[cheap].fastest)}. ` +
      `You are trading ${fmtMins(dT)} for ${money(dM)} — about ${money(dM/(dT/60))} an hour. On overnight legs the train usually wins anyway, because the berth replaces a hotel night.`;
  }
  if(/see|visit|tourist|place|attraction|do there|sightsee/.test(t)){
    const sp = SPOTS[leg.to] || [];
    return `In ${dest.n}: ${sp.map(s=>`<b>${s.n}</b> (${s.t}, ${s.fee}) — ${s.best}`).join('<br>')}<br><br>Open the places tab for the full cards and the metro lines that reach them.`;
  }
  if(/point|loyalty|tier|reward/.test(t)){
    const p = S.profile?.points||0, t2 = tierOf(p), next = LOYALTY.find(x=>x.at>p);
    return `You hold ${p.toLocaleString('en-IN')} points, which is <b>${t2.n}</b> — ${t2.perk}.` + (next?` ${(next.at-p).toLocaleString('en-IN')} more reaches ${next.n}.`:` That is the top tier.`);
  }
  if(/speed|how fast|live|track/.test(t)){
    const tr = S.picks[S.activeLeg] || currentPool(leg).sort((a,b)=>a.total-b.total)[0];
    if(!tr) return `Every vehicle type gets a live tracker now — flights show altitude, trains and metro show speed and running status, buses and cars show road speed and ETA. Pick a vehicle on this leg and the tracker opens on the options page.`;
    const conf = TRACK_CONF[tr.mode];
    const extra = tr.mode==='flight' ? ' with a live altitude readout climbing to cruise and back down on approach'
                : tr.mode==='metro' ? ', counting down to the next station'
                : tr.mode==='train' ? ', including signal holds and running status'
                : ' with road speed and an ETA that tightens as the trip progresses';
    return `${conf.label} is on for ${tr.opName} ${tr.code}. It averages ${tr.avgSpeed} km/h with a ${tr.topSpeed} km/h cap${extra} — the gauge on the options page (and on your ticket once booked) updates from a simulated GPS ping every four seconds.`;
  }
  if(/family|kid|child|solo|bundle/.test(t)){
    const b = bundleFor(10000, S.passengers.length||1, S.bundle);
    return `You are on the <b>${b.n}</b> bundle at ${Math.round(b.pct*100)}% off. It includes: ${b.add.join('; ')}. Children under five ride free on trains and buses, and five to eleven pays half — that is applied automatically from the ages in the passenger form.`;
  }
  if(/hi|hello|hey|help/.test(t)){
    return `I can price the whole itinerary, compare vehicles on time against money, read out entry requirements, and explain refunds. Ask me anything, or tap a suggestion below.`;
  }
  const pool = currentPool(leg);
  return `I do not have a clean answer for that. What I can see right now: ${pool.length} vehicles on ${CITIES[leg.from].n} → ${dest.n}, from ${money(Math.min(...pool.map(o=>o.total)))}. Try asking about fares, visas, seats, refunds or what to see.`;
}
function aiAsk(q){
  aiUser(q);
  setTimeout(()=>aiSay(aiAnswer(q)), 420);
}
